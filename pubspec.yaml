name: thlaby3_save_editor
description: A save editor for the game Touhou Labyrinth Tri.

publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^9.0.1
  flutter:
    sdk: flutter
  provider: 6.1.4
  tfields:
    git:
      url: https://github.com/thurler/tfields
      tag: 2.1.0
  url_launcher: ^6.1.11
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding
      path: plugins/window_size

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - img/characterBox/
    - img/characterRect/
    - img/characterStand/
    - img/characterTrapez/
    - img/
